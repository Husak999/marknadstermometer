name: Marknadstermometer – uppdatera data

on:
  schedule:
    # Varje timme under amerikansk handel (UTC), måndag–fredag
    - cron: "17 13-21 * * 1-5"
    # Efter stängning + en morgonkörning svensk tid
    - cron: "17 22 * * 1-5"
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "marknadstermometer/build_data.py"
      - ".github/workflows/marknadstermometer.yml"

permissions:
  contents: write

concurrency:
  group: marknadstermometer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: marknadstermometer/requirements.txt

      - name: Installera beroenden
        run: pip install -r marknadstermometer/requirements.txt

      - name: Hämta data och bygg data.json
        run: python marknadstermometer/build_data.py

      - name: Committa uppdaterad data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marknadstermometer/data.json marknadstermometer/sp500_fallback.json
          if git diff --cached --quiet; then
            echo "Ingen förändring"
          else
            git commit -m "Uppdatera marknadstermometer-data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
